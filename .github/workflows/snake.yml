name: Generate Snake Animation

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFA5D6&color_dots=#ebedf0,#ffd1e8,#ffa5d6,#f765b8,#d42b87
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFA5D6&color_dots=#161b22,#661a40,#aa2e6c,#f06292,#ffa5d6
            
      - name: Push snake svgs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
